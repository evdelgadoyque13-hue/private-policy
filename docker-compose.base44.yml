services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - .:/repo:ro
    command: ["sh", "-c", "cp /repo/.github/workflows/deploy3.yml /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
