    <h1>Privacy Policy</h1>
    <p>Last updated: August 16, 2026</p>

    <p>This Privacy Policy describes the policies and procedures of <strong>Elizabeth Valle Delgado</strong> ("we," "us," or "our") on the collection, use, and disclosure of your information when you use the <strong>Analyst Canvas</strong> mobile application (the "App") built on the Reality Platform.</p>

    <h2>1. Information We Collect</h2>
    <p>We may collect personal information that you provide directly to us, including but not limited to:</p>
    <ul>
        <li>Name and email address when you create an account or contact us.</li>
        <li>Account login credentials.</li>
        <li>Analytics data and user-generated content submitted within the App.</li>
    </ul>

    <h2>2. How We Use Your Information</h2>
    <p>We use your information to provide, maintain, and improve the App, including to:</p>
    <ul>
        <li>Manage your account and access to Analyst Canvas.</li>
        <li>Provide technical support and fix bugs.</li>
        <li>Monitor app performance on the Reality Platform.</li>
    </ul>

    <h2>3. Sharing Your Information</h2>
    <p>We do not sell, rent, or trade your personal data. We only share your information with trusted third-party service providers that help us run our App (such as database providers), or when required by law.</p>

    <h2>4. Children's Privacy</h2>
    <p>Our App does not address anyone under the age of 13. We do not knowingly collect personally identifiable information from children under 13.</p>

    <h2>5. Data Security</h2>
    <p>The security of your data is important to us. Please remember that no method of transmission over the Internet or electronic storage is 100% secure.</p>

    <h2>6. Changes to This Privacy Policy</h2>
    <p>We may update our Privacy Policy from time to time. We will notify you of any changes by posting the new Privacy Policy on this page.</p>

    <h2>7. Contact Us</h2>
    <p>If you have any questions about this Privacy Policy, you can contact us at:</p>
    <p>Email: [evdelgadoyque13@gmail.com]</p>
